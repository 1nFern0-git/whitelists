name: DNS cache

# Раннер резолвит домены обычным интернетом, а в сети оператора DNS отвечает
# только на белый список — остальные домены проверить нечем. Поэтому адреса
# собираются здесь и лежат в configs/dns-cache.json.
#
# Готовые списки (release/) workflow не собирает: они зависят от сети
# конкретного человека и собираются локально после его прогона.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/domains/**'
      - 'tools/cache_dns.py'

permissions:
  contents: write

concurrency:
  group: dns-cache
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        # Один источник версий для пользователя, этого workflow и CI-тестов.
        run: pip install -r requirements.txt

      - name: Build DNS cache
        run: python3 tools/cache_dns.py

      - name: Commit cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add configs/dns-cache.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: кэш адресов для полевых прогонов"
            git pull --rebase --autostash
            git push
          fi
