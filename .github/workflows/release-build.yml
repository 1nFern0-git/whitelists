name: Release build

# Два шага подряд, чтобы не толкаться в main одновременно:
#   1) кэш адресов — его собирает раннер, у которого есть обычный интернет;
#      в сети оператора DNS не отвечает, и без кэша домен нечем проверять;
#   2) сборка release из накопленных наблюдений в runs/.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runs/**'
      - 'src/domains/**'
      - 'tools/**'
      - 'configs/release.json'

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  dns-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dnspython
        run: pip install dnspython==2.7.0

      - name: Build DNS cache
        run: python3 tools/cache_dns.py

      - name: Commit cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add dns-cache.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: кэш адресов для полевых прогонов"
            git pull --rebase --autostash
            git push
          fi

  release:
    needs: dns-cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Только стандартная библиотека — pip install не нужен
      - name: Build release lists
        run: python3 tools/build_all_release.py

      - name: Commit release
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add release/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: release build"
            git pull --rebase --autostash
            git push
          fi
