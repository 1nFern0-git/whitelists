name: Release build

# Release пересобирается из накопленных наблюдений в runs/.
# Фильтрация у операторов разная, поэтому на выходе файл на оператора.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runs/**'
      - 'src/domains/**'
      - 'tools/build_release.py'
      - 'tools/build_all_release.py'
      - 'configs/release.json'

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Только стандартная библиотека — pip install не нужен
      - name: Build release lists
        run: python3 tools/build_all_release.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add release/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: release build"
            git push
          fi
